name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version (strictly newer); leave empty for Cocogitto
        type: string
        default: ''
      publish:
        description: Publish to npm through OIDC (leave off to prepare a draft)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'carere/renkin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      revision: ${{ steps.prepare.outputs.revision }}
      source: ${{ steps.prepare.outputs.source }}
      skip: ${{ steps.prepare.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          args: --ignore-merge-commits
      - name: Reserve or resume the release version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun --no-env-file packages/renkin/release-workflow.ts prepare

  checks:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      stress: true
    secrets: inherit

  pack:
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build or restore the canonical release bundle
        run: bun --no-env-file packages/renkin/release-workflow.ts pack
      - uses: actions/upload-artifact@v4
        with:
          name: renkin-release-canonical
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .renkin/release/artifact.json
            .renkin/release/renkin-*.tgz

  validate:
    needs: [prepare, pack]
    uses: ./.github/workflows/release-artifact.yml
    with:
      artifact-name: renkin-release-canonical
      revision: ${{ needs.prepare.outputs.revision }}

  release:
    needs: [prepare, pack, validate]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm with trusted publishing support
        run: |
          npm install --global --prefix "$RUNNER_TEMP/release-npm" npm@11.16.0
          echo "$RUNNER_TEMP/release-npm/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: renkin-release-canonical
          path: .renkin/release
      - name: Publish or resume the validated release
        if: inputs.publish
        run: bun --no-env-file packages/renkin/release-workflow.ts publish
      - name: Describe validated draft
        if: ${{ !inputs.publish }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Draft v$VERSION passed validation. Its bundle contains the canonical tarball and artifact.json. Run Release with publish enabled and version empty to resume this candidate while main is unchanged." >> "$GITHUB_STEP_SUMMARY"
