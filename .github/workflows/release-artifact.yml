name: Release artifact validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "bun.lock"
      - "LICENSE"
      - "NOTICE"
      - "*PROVENANCE*"
      - "*NOTICES*"
      - ".github/workflows/release-artifact.yml"

permissions:
  contents: read

jobs:
  installed-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install locked build dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Pack and validate an isolated installed consumer
        working-directory: packages/renkin
        run: bun --bun vitest run --config vitest.release.config.ts
      - name: Preserve exact artifact identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renkin-release-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .renkin/release/artifact.json
            .renkin/release/renkin-*.tgz
      - name: Ensure source manifests were not rewritten
        run: git diff --exit-code
