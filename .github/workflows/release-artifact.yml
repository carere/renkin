name: Release artifact validation

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Canonical tarball artifact from the calling release workflow
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "bun.lock"
      - ".prototools"
      - "LICENSE"
      - "NOTICE"
      - "*PROVENANCE*"
      - "*NOTICES*"
      - ".github/workflows/release-artifact.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  installed-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install locked build dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      - name: Download canonical release artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: .renkin/release
      - name: Select canonical tarball
        if: inputs.artifact-name != ''
        run: |
          version=$(jq -r .version packages/renkin/package.json)
          echo "RENKIN_RELEASE_ARCHIVE=$GITHUB_WORKSPACE/.renkin/release/renkin-$version.tgz" >> "$GITHUB_ENV"
      - name: Pack and validate an isolated installed consumer
        working-directory: packages/renkin
        run: bun --bun vitest run --mode release --project release
      - name: Preserve exact artifact identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renkin-release-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .renkin/release/artifact.json
            .renkin/release/renkin-*.tgz
      - name: Ensure source manifests were not rewritten
        run: git diff --exit-code
