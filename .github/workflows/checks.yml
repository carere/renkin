name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize Moon workspace
        run: bun moon sync

      - name: Check TypeScript types
        run: bun tsc --build

      - name: Check formatting and lint rules
        run: bun biome check .

      - name: Check unused code and dependencies
        run: bun knip

      - name: Check package manifest sorting
        run: bun sort-package-json --check package.json apps/*/package.json packages/*/package.json

      - name: Install Chromium for framework browser checks
        run: bun x playwright install --with-deps chromium

      - name: Run behavioral tests without provider credentials
        run: |
          bun moon run core:test-unit core:test-integration
          bun moon run cloudflare-sdk:test-integration cloudflare:test-unit cloudflare:test-integration
          # Each integration task can start several workerd/browser/compiler processes.
          # Serialize tasks and ordinary test files; explicit concurrency tests remain enabled.
          bun moon run --concurrency 1 runtime:test-integration renkin:test-unit renkin:test-integration -- --no-file-parallelism
          bun moon run --concurrency 1 renkin:test-release-preparation -- --no-file-parallelism
          bun moon run --concurrency 1 websites:test-unit websites:test-integration example-spa:test-integration example-ssr:test-integration -- --no-file-parallelism
          bun moon run --concurrency 1 example-static:test-integration website:test-integration -- --no-file-parallelism

      - name: Ensure checks leave tracked files unchanged
        run: git diff --exit-code

      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --ignore-merge-commits

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"
