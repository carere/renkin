name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    env:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize Moon workspace
        run: bun moon sync

      - name: Check TypeScript types
        run: bun tsc --build

      - name: Check formatting and lint rules
        run: bun biome check .

      - name: Check unused code and dependencies
        run: bun knip

      - name: Check package manifest sorting
        run: bun sort-package-json --check package.json apps/*/package.json packages/*/package.json

      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --ignore-merge-commits

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$PR_TITLE"

      - name: Ensure static checks leave tracked files unchanged
        run: git diff --exit-code

  regular:
    needs: static
    runs-on: ubuntu-24.04
    env:
      MOON_REMOTE_CACHE_TOKEN: ${{ secrets.MOON_REMOTE_CACHE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize Moon workspace
        run: bun moon sync

      - name: Run unit tests
        run: bun moon run :test-unit

      - name: Install Chromium for framework browser checks
        run: bun x playwright install --with-deps chromium

      - name: Run local integration tests
        run: bun moon run --concurrency 1 :test-integration -- --no-file-parallelism

      - name: Check cloud test preparation without provider credentials
        run: bun moon run --concurrency 1 :test-release-preparation -- --no-file-parallelism

      - name: Check Astro SSR through its CLI
        run: bun moon run --concurrency 1 :test-astro -- --no-file-parallelism

      - name: Ensure checks leave tracked files unchanged
        run: git diff --exit-code
