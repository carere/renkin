$schema: ../../.moon/cache/schemas/project.json
language: typescript
stack: backend
tasks:
  test-unit:
    command: vitest run --project unit
    options:
      cache: false
  test-integration:
    command: vitest run --project integration
    options:
      cache: false
  test-cloud:
    command: vitest run --config vitest.cloud.config.ts
    options:
      cache: false
  build:
    command: bun --no-env-file release.ts build
    options:
      cache: false
  pack:
    command: bun --no-env-file release.ts pack
    options:
      cache: false
  test-release:
    command: bun --bun vitest run --config vitest.release.config.ts
    options:
      cache: false
  test-release-preparation:
    command: vitest run --config vitest.release-cloud.config.ts --project preparation
    options:
      cache: false
  test-astro:
    command: vitest run --root tests/fixtures/astro-ssr --project integration
    options:
      cache: false
